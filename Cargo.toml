[package]
name = "mbitool"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
binrw = "0.15.2"
clap = { version = "4.6.6", features = ["derive"] }
modular-bitfield = "0.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_toml = "0.0.1"
sha2 = "0.11.0"
thiserror = "2.0.20"
zerocopy = { version = "0.8.56", features = ["zerocopy-derive"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
